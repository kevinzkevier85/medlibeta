<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedLib</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#B3202E">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>
  // theme before first paint (same choice as Settings › ธีม)
  try { var t = localStorage.getItem("medlib.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css?v=0.7.1">
</head>
<body>
<div class="shell">
  <header class="bar">
    <a class="brand" href="#/"><i aria-hidden="true"></i>MedLib</a>
    <nav class="modes" id="modes" aria-label="โหมด"></nav>
    <label class="search" for="q">
      <span aria-hidden="true">⌕</span>
      <input id="q" type="search" placeholder="ค้นทุกบล็อก: หัวข้อ, ยา, โรค, หน้า lecture…" autocomplete="off">
    </label>
    <nav class="tools" id="tools" aria-label="เครื่องมือ"></nav>
  </header>
  <nav class="side" id="side" aria-label="เมนู"></nav>
  <main class="main" id="main" aria-live="polite"><p class="hint">กำลังโหลด…</p></main>
</div>
<script src="vendor/pdf.min.js"></script>
<script src="lib/validate.js?v=0.7.1"></script>
<script src="lib/quizcore.js?v=0.7.1"></script>
<script src="quiz.js?v=0.7.1"></script>
<script src="app.js?v=0.7.1"></script>
</body>
</html>
